[package]
authors = ["Zhenjun <netprism@netprism.org>"]
categories = ["database", "network-programming"]
description = "Backend for Zenoh using DuckDB"
edition = "2021"
license = "GPL-2.0-only"
name = "zenoh-backend-duckdb"
repository = "https://github.com/netprism/zenoh-backend-duckdb"
version = "1.5.0"

[lib]
name = "zenoh_backend_duckdb"
crate-type = ["cdylib"]

[features]
default = ["dynamic_plugin", "zenoh/default"]
dynamic_plugin = []

[dependencies]
async-trait = "0.1.82"
git-version = "0.3.9"
serde_json = "1.0.128"
tokio = { version = "1.40.0", default-features = false } # Default features are disabled due to some crates' requirements
zenoh = { version = "1.5.0", features = [
  "internal",
  "plugins",
  "unstable",
] , git = "https://github.com/eclipse-zenoh/zenoh.git" , branch = "main" }
zenoh-plugin-trait = { version = "1.5.0", git = "https://github.com/eclipse-zenoh/zenoh.git" , branch = "main" }
zenoh_backend_traits = { version = "1.5.0", git = "https://github.com/eclipse-zenoh/zenoh.git" , branch = "main" }
zenoh-ext = { version = "1.5.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main" }
zenoh-util = { version = "1.5.0", git = "https://github.com/eclipse-zenoh/zenoh.git", branch = "main" }
duckdb = { version = "1.3.2", features = ["bundled"] }
tracing = "0.1"

[build-dependencies]
rustc_version = "0.4.0"

[dev-dependencies]
tempfile = "3.8.0"
tokio-test = "0.4.3"

[package.metadata.deb]
copyright = "2025 NetPrism Technology"
depends = "zenoh-plugin-storage-manager (=1.5.0)"
license-file = ["LICENSE", "0"]
maintainer = "zhenjun@netprism.org"
name = "zenoh-backend-duckdb"
section = "net"
